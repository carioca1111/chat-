name: Build Gridium Windows Alpha 8.3

on:
  push:
    branches:
      - gridium-next
    paths:
      - '.github/workflows/build-gridium-windows-alpha83.yml'
      - 'apply-alpha83.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Gridium base source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "gridium-ci/source.*.b64" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("Gridium-source.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "gridium-build" | Out-Null
          Expand-Archive -Path "Gridium-source.zip" -DestinationPath "gridium-build" -Force
          if (-not (Test-Path "gridium-build/package.json")) { throw "package.json not found after extraction" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Alpha 4
        shell: pwsh
        run: node gridium-desktop/apply-alpha4.js gridium-build

      - name: Apply Alpha 5
        shell: pwsh
        run: node gridium-desktop/apply-alpha5.js gridium-build

      - name: Apply Alpha 6.1
        shell: pwsh
        run: node apply-alpha61.js gridium-build

      - name: Apply Alpha 6.2
        shell: pwsh
        run: node apply-alpha62.js gridium-build

      - name: Apply Alpha 7
        shell: pwsh
        run: node apply-alpha7.js gridium-build

      - name: Apply Alpha 7.1
        shell: pwsh
        run: node apply-alpha71-fixed.js gridium-build

      - name: Apply Alpha 8
        shell: pwsh
        run: node apply-alpha8.js gridium-build

      - name: Apply Alpha 8.1
        shell: pwsh
        run: node apply-alpha81.js gridium-build

      - name: Apply Alpha 8.2
        shell: pwsh
        run: node apply-alpha82.js gridium-build

      - name: Apply Alpha 8.3 one-click UI
        shell: pwsh
        run: node apply-alpha83.js gridium-build

      - name: Verify Alpha 8.3 one-click behavior
        shell: pwsh
        run: |
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'id="alphaAutopilot"')) { throw "Autopilot button missing" }
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'Alpha 8.3: automático em 1 clique')) { throw "Alpha 8.3 header missing" }
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'id="alphaLiveToggle"' | Select-String -SimpleMatch 'aria-hidden="true"')) { throw "Manual LIVE button not hidden" }
          if (-not (Select-String -Path "gridium-build/styles.css" -SimpleMatch 'GRID_ALPHA83_ONE_CLICK')) { throw "Alpha 8.3 CSS marker missing" }
          if (-not (Select-String -Path "gridium-build/styles.css" -SimpleMatch '#notice,#alphaLiveToggle{display:none!important}')) { throw "Click notices/manual LIVE control still visible" }
          if (-not (Select-String -Path "gridium-build/renderer.js" -SimpleMatch "console.debug('[Gridium]'")) { throw "Silent click notice handler missing" }
          if (Select-String -Path "gridium-build/main.js" -SimpleMatch "throw new Error('Protocolo histórico ainda não está validado')") { throw "Autopilot still requires manual pre-arm validation" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch 'LIVE liberado automaticamente')) { throw "Automatic LIVE arming status missing" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch "LIVE aguardando liberação automática")) { throw "Automatic LIVE warming status missing" }
          if (Select-String -Path "gridium-build/main.js" -SimpleMatch 'setInterval(()=>void autoNavigateMarketTick(),2500)') { throw "Aggressive visible tab navigator returned" }
          node --check gridium-build/main.js
          node --check gridium-build/renderer.js
          node --check gridium-build/preload.js
          node --check gridium-build/alpha-engine.js
          node --check gridium-build/market-live.js
          node --check gridium-build/market-inspector.js
          node --check gridium-build/network-inspector.js
          node --test gridium-build/test/alpha82-market-safety.test.js
          $pkg = Get-Content "gridium-build/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '3.0.0-alpha.8.3') { throw "Unexpected Gridium version: $($pkg.version)" }

      - name: Install dependencies
        working-directory: gridium-build
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run full tests
        working-directory: gridium-build
        shell: pwsh
        run: npm test

      - name: Upload assembled Alpha 8.3 runtime source
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-LIVE-runtime-source-8.3
          path: |
            gridium-build/renderer.js
            gridium-build/preload.js
            gridium-build/main.js
            gridium-build/alpha-engine.js
            gridium-build/market-live.js
            gridium-build/market-inspector.js
            gridium-build/network-inspector.js
            gridium-build/market-protocol.js
            gridium-build/index.html
            gridium-build/styles.css
            gridium-build/package.json
          if-no-files-found: error
          retention-days: 7

      - name: Build Windows installer
        working-directory: gridium-build
        shell: pwsh
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.8.3
          path: gridium-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
