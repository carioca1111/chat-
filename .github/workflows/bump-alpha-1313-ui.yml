name: Apply Alpha 1.3.13 UI labels

on:
  push:
    branches:
      - fix/potion-revive-live-protocol
    paths:
      - '.github/scripts/bump-alpha-1313-ui.mjs'
      - '.github/workflows/bump-alpha-1313-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Update visible version labels
        run: node .github/scripts/bump-alpha-1313-ui.mjs
      - name: Commit and push labels
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/src/renderer/src/App.tsx gridium2/src/renderer/index.html gridium2/src/main/index.ts
          git diff --cached --check
          git commit -m "chore: align Alpha 1.3.13 version labels"
          git push origin HEAD:fix/potion-revive-live-protocol
