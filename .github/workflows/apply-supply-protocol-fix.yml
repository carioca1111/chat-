name: Apply supply protocol fix

on:
  push:
    branches:
      - fix/supply-protocol
    paths:
      - '.github/workflows/apply-supply-protocol-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply deterministic source patch
        run: node .github/scripts/run-supply-protocol-fix.mjs
      - name: Install dependencies
        working-directory: gridium2
        run: npm install --no-audit --no-fund
      - name: Focused typecheck and Hunt runtime regression
        working-directory: gridium2
        run: |
          npm run typecheck
          npx vitest run tests/hunt-session-runtime.test.ts
      - name: Commit and push release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/src/main/hunt-session-runtime.ts gridium2/tests/hunt-session-runtime.test.ts
          git diff --cached --check
          git commit -m "release: Gridium 2 Alpha 1.3.11 supply counter fix"
          git push origin HEAD:fix/supply-protocol
