name: Apply Alpha 1.3.15 Headless Supply

on:
  push:
    branches:
      - fix/potion-revive-ui-fallback
    paths:
      - '.github/scripts/apply-alpha1315-headless.mjs'
      - '.github/scripts/add-alpha1315-tests.mjs'
      - '.github/workflows/apply-alpha1315-headless.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Apply headless supply patch
        run: |
          node .github/scripts/apply-alpha1315-headless.mjs
          node .github/scripts/add-alpha1315-tests.mjs
      - name: Install dependencies
        working-directory: gridium2
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: gridium2
        run: npm run typecheck
      - name: Focused headless tests
        working-directory: gridium2
        run: npx vitest run tests/headless-supply-inference.test.ts tests/hunt-session-headless-supply.test.ts tests/no-ui-supply-reader.test.ts
      - name: Full unit tests
        working-directory: gridium2
        run: npm test
      - name: Commit Alpha 1.3.15
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A gridium2
          git diff --cached --check
          git commit -m "release: Gridium 2 Alpha 1.3.15 headless potion revive inference"
          git push origin HEAD:fix/potion-revive-ui-fallback
