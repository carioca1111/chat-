name: Export Gridium Popular Source Verification

on:
  push:
    branches:
      - gridium-popular
    paths:
      - '.github/workflows/export-gridium-popular-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble Popular source
        shell: pwsh
        run: ./build-popular.ps1
      - name: Upload assembled source for verification
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Popular-Source-Verification
          path: gridium-build
          if-no-files-found: error
          retention-days: 1
