name: Export Alpha910 Runtime
on:
  push:
    branches: [gridium-next]
    paths:
      - '.github/workflows/export-alpha910-runtime.yml'
      - 'export-alpha910-runtime.ps1'
  workflow_dispatch:
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./export-alpha910-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Alpha910-Runtime
          path: alpha910-runtime.zip
# triggered for Alpha 9.11 reconstruction
