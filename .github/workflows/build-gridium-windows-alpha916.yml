name: Build Gridium Windows Alpha 9.16 Ultra Performance

on:
  push:
    branches: [gridium-next]
    paths:
      - 'alpha916-src/**'
      - 'alpha916-cloud/**'
      - 'alpha916-benchmark.js'
      - 'apply-alpha916.js'
      - 'build-alpha916.ps1'
      - '.github/workflows/build-gridium-windows-alpha916.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: minimal
      - name: Assemble Alpha 9.16
        shell: pwsh
        run: ./build-alpha916.ps1
      - name: Install desktop dependencies
        working-directory: gridium-build
        shell: pwsh
        run: npm install --no-audit --no-fund
      - name: Compile independent Sniper engines
        shell: pwsh
        run: ./build-sniper-alpha913.ps1
      - name: Validate and test
        working-directory: gridium-build
        shell: pwsh
        run: |
          if ((Get-Content package.json -Raw) -notmatch '3.0.0-alpha.9.16') { throw 'Alpha 9.16 version missing' }
          node --check main.js
          node --check renderer.js
          node --check preload.js
          node --check alpha-core-process.js
          node --check ultra-runtime.js
          node --check analytics-client.js
          npm test
      - name: Build Windows installer
        working-directory: gridium-build
        shell: pwsh
        run: npm run dist:win
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-Item 'gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.16.exe'
          if ($installer.Length -lt 50000000) { throw "Installer too small: $($installer.Length) bytes" }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "Installer bytes: $($installer.Length)"
          "Installer SHA256: $($hash.Hash)"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.16
          path: gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.16.exe
          if-no-files-found: error
          retention-days: 30
