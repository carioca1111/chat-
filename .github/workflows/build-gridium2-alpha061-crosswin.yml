name: Build Gridium 2 Alpha 0.6.1 Final Windows

on:
  push:
    branches:
      - gridium2-alpha0.6-hunt-route-v2
    paths:
      - '.github/workflows/build-gridium2-alpha061-crosswin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build Electron app
        run: npm run build

      - name: Build Windows NSIS installer (cross-build)
        run: npx electron-builder --win nsis --x64 --config.win.signAndEditExecutable=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        run: |
          test -f release/Gridium-2-Alpha-0.6.1-Setup.exe
          sha256sum release/Gridium-2-Alpha-0.6.1-Setup.exe

      - name: Upload final Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-0.6.1-Hunt-Intelligence-FINAL-Windows
          path: gridium2/release/Gridium-2-Alpha-0.6.1-Setup.exe
          if-no-files-found: error
          retention-days: 90
