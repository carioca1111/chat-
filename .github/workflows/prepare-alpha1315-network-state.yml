name: Prepare Alpha 1.3.15 Network State

on:
  push:
    branches:
      - fix/potion-revive-network-state
    paths:
      - '.github/scripts/prepare-alpha1315-network-state.mjs'
      - '.github/workflows/prepare-alpha1315-network-state.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Prepare Alpha 1.3.15
        run: node .github/scripts/prepare-alpha1315-network-state.mjs
      - name: Verify release strings
        shell: bash
        run: |
          grep -q '2.0.0-alpha.13.15' gridium2/package.json
          grep -q 'Gridium-2-Alpha-1.3.15-Setup' gridium2/electron-builder.yml
          grep -q 'ALPHA 1.3.15' gridium2/src/renderer/src/App.tsx
          grep -q 'Alpha 1.3.15 Network Supply State' gridium2/src/renderer/index.html
          grep -q 'Alpha 1.3.15 Network Supply State' gridium2/src/main/index.ts
      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/package.json gridium2/electron-builder.yml gridium2/src/renderer/src/App.tsx gridium2/src/renderer/index.html gridium2/src/main/index.ts
          git diff --cached --check
          git commit -m "chore: prepare Gridium 2 Alpha 1.3.15 network state"
          git push origin HEAD:fix/potion-revive-network-state
