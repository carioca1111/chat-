name: Build Gridium Windows

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'gridium-ci/**'
      - 'gridium-desktop/**'
      - '.github/workflows/build-gridium-windows.yml'
      - 'apply-alpha61.js'
      - 'apply-alpha62.js'
      - 'apply-alpha7.js'
      - 'apply-alpha71-fixed.js'
      - 'apply-alpha8.js'
      - 'apply-alpha81.js'
      - 'apply-alpha82.js'
      - 'apply-alpha82.js.gz.b64'
      - 'alpha8-parts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Gridium base source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "gridium-ci/source.*.b64" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("Gridium-source.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "gridium-build" | Out-Null
          Expand-Archive -Path "Gridium-source.zip" -DestinationPath "gridium-build" -Force
          if (-not (Test-Path "gridium-build/package.json")) { throw "package.json not found after extraction" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Gridium Alpha 4 Market Protocol overlay
        shell: pwsh
        run: node gridium-desktop/apply-alpha4.js gridium-build

      - name: Apply Gridium Alpha 5 Operations overlay
        shell: pwsh
        run: node gridium-desktop/apply-alpha5.js gridium-build

      - name: Apply Gridium Alpha 6.1 LIVE Trading and UI
        shell: pwsh
        run: node apply-alpha61.js gridium-build

      - name: Apply Gridium Alpha 6.2 Electron prompt hotfix
        shell: pwsh
        run: node apply-alpha62.js gridium-build

      - name: Apply Gridium Alpha 7 Auto Trader and automatic inspection
        shell: pwsh
        run: node apply-alpha7.js gridium-build

      - name: Apply Gridium Alpha 7.1 Auto Trader feed fix
        shell: pwsh
        run: node apply-alpha71-fixed.js gridium-build

      - name: Apply Gridium Alpha 8 Full Autopilot
        shell: pwsh
        run: node apply-alpha8.js gridium-build

      - name: Apply Gridium Alpha 8.1 stable four-account UI
        shell: pwsh
        run: node apply-alpha81.js gridium-build

      - name: Apply Gridium Alpha 8.2 Market health and safeguards
        shell: pwsh
        run: node apply-alpha82.js gridium-build

      - name: Verify Alpha 8.2 market audit and UI
        shell: pwsh
        run: |
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'id="alphaAutopilot"')) { throw "Autopilot button missing" }
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'data-layout="grid"')) { throw "2x2 account layout control missing" }
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'game-grid layout-grid')) { throw "2x2 layout is not default" }
          if (Select-String -Path "gridium-build/index.html" -SimpleMatch 'data-layout="vertical"') { throw "Vertical account layout still exposed" }
          if (Select-String -Path "gridium-build/main.js" -SimpleMatch 'setInterval(()=>void autoNavigateMarketTick(),2500)') { throw "Aggressive visible tab navigator still active" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch 'sendPassiveMarketProbe')) { throw "Passive Market probe missing" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch 'Page.addScriptToEvaluateOnNewDocument')) { throw "WebSocket bridge preload injection missing" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch "state:'warming'")) { throw "Fail-closed warming state missing" }
          if (-not (Select-String -Path "gridium-build/network-inspector.js" -SimpleMatch 'marketEvents:[]')) { throw "Dedicated Market event buffer missing" }
          if (-not (Select-String -Path "gridium-build/market-inspector.js" -SimpleMatch 'const at=Number(scan.at)||Date.now()')) { throw "DOM listing timestamp fix missing" }
          if (-not (Select-String -Path "gridium-build/alpha-engine.js" -SimpleMatch 'failClosedAutopilot:true')) { throw "Fail-closed feature flag missing" }
          if (Select-String -Path "gridium-build/renderer.js" -SimpleMatch 'renderAutoTrader(data.autoTrader);r);') { throw "Renderer corruption present" }
          if (Select-String -Path "gridium-build/renderer.js" -SimpleMatch '=prompt(') { throw "Unsupported window.prompt call still present" }
          node --check gridium-build/main.js
          node --check gridium-build/renderer.js
          node --check gridium-build/preload.js
          node --check gridium-build/alpha-engine.js
          node --check gridium-build/market-live.js
          node --check gridium-build/market-inspector.js
          node --check gridium-build/network-inspector.js
          node --test gridium-build/test/alpha82-market-safety.test.js
          $pkg = Get-Content "gridium-build/package.json" -Raw | ConvertFrom-Json
          if ($pkg.version -ne '3.0.0-alpha.8.2') { throw "Unexpected Gridium version: $($pkg.version)" }

      - name: Smoke test AlphaEngine safeguards
        shell: pwsh
        run: node -e "const os=require('os'),path=require('path'),fs=require('fs');const {AlphaEngine}=require('./gridium-build/alpha-engine.js');const p=path.join(os.tmpdir(),'gridium-alpha82-smoke-'+process.pid+'.sqlite');const e=new AlphaEngine(p);const v=e.view().validation;for(const k of Object.keys(v))v[k]=true;e.setValidation(v);if(e.unlockLive(true).settings.liveExecutionUnlocked!==true)throw new Error('LIVE did not unlock');if(e.unlockLive(false).settings.liveExecutionUnlocked!==false)throw new Error('LIVE did not lock');const f=e.view().features;if(f.passiveMarketProbe!==true||f.runtimeMarketHealth!==true||f.failClosedAutopilot!==true)throw new Error('Alpha 8.2 feature flags unavailable');e.close();for(const x of [p,p+'-wal',p+'-shm',p+'.json'])try{fs.unlinkSync(x)}catch{};console.log('AlphaEngine Alpha 8.2 smoke OK')"

      - name: Upload assembled Alpha 8.2 runtime source
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-LIVE-runtime-source-8.2
          path: |
            gridium-build/renderer.js
            gridium-build/preload.js
            gridium-build/main.js
            gridium-build/alpha-engine.js
            gridium-build/market-live.js
            gridium-build/market-inspector.js
            gridium-build/network-inspector.js
            gridium-build/market-protocol.js
            gridium-build/index.html
            gridium-build/styles.css
            gridium-build/package.json
            gridium-build/test/alpha82-market-safety.test.js
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        working-directory: gridium-build
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: gridium-build
        shell: pwsh
        run: npm test

      - name: Build Windows installer
        working-directory: gridium-build
        shell: pwsh
        run: npm run dist:win

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Path "gridium-build/dist" -Recurse | Select-Object FullName, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.8.2
          path: gridium-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
