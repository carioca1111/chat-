name: Build Gridium Windows

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'gridium-ci/**'
      - 'gridium-desktop/**'
      - '.github/workflows/build-gridium-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Gridium base source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem "gridium-ci/source.*.b64" | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("Gridium-source.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path "gridium-build" | Out-Null
          Expand-Archive -Path "Gridium-source.zip" -DestinationPath "gridium-build" -Force
          if (-not (Test-Path "gridium-build/package.json")) { throw "package.json not found after extraction" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Gridium Alpha 4 Market Protocol overlay
        shell: pwsh
        run: node gridium-desktop/apply-alpha4.js gridium-build

      - name: Apply Gridium Alpha 5 Operations overlay
        shell: pwsh
        run: node gridium-desktop/apply-alpha5.js gridium-build

      # Alpha 6.1 includes the complete regenerated Alpha 6 LIVE patch, then the UI hotfix.
      # Patch chunks and ARMAR LIVE handler are verified before installer generation.
      - name: Apply Gridium Alpha 6.1 LIVE Trading and UI
        shell: pwsh
        run: node apply-alpha61.js gridium-build

      - name: Verify Alpha 6.1 LIVE controls and bridge
        shell: pwsh
        run: |
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'id="alphaLiveToggle"')) { throw "ARMAR LIVE control missing" }
          if (-not (Select-String -Path "gridium-build/index.html" -SimpleMatch 'Alpha 6.1')) { throw "Alpha 6.1 marker missing" }
          if (-not (Select-String -Path "gridium-build/renderer.js" -SimpleMatch "$('alphaLiveToggle').onclick")) { throw "ARMAR LIVE handler missing" }
          if (-not (Select-String -Path "gridium-build/preload.js" -SimpleMatch 'alphaLiveUnlock:')) { throw "LIVE preload bridge missing" }
          if (-not (Select-String -Path "gridium-build/main.js" -SimpleMatch 'grid:alpha-live-buy')) { throw "LIVE buy IPC missing" }
          if (-not (Test-Path "gridium-build/market-live.js")) { throw "market-live.js missing" }

      - name: Install dependencies
        working-directory: gridium-build
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: gridium-build
        shell: pwsh
        run: npm test

      - name: Build Windows installer
        working-directory: gridium-build
        shell: pwsh
        run: npm run dist:win

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem -Path "gridium-build/dist" -Recurse | Select-Object FullName, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.6.1
          path: gridium-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
