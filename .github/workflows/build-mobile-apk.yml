name: Build Gridium Mobile 2.5 Mirroring
on:
  workflow_dispatch:
  push:
    branches: [gridium-alpha11.8.6-mobile-mirroring]
    paths:
      - 'mobile-android/**'
      - 'mirror-relay.js'
      - 'test/mirror-relay.test.js'
      - '.github/workflows/build-mobile-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mirror JavaScript syntax
        run: node --check mobile-android/app/src/main/assets/mirror-mobile.js
      - name: Relay signaling tests
        run: node --test test/mirror-relay.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: mobile-android
        run: gradle assembleDebug
      - name: Verify APK
        run: |
          APK=mobile-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" assets/mirror-mobile.js | grep -q 'Espelhamento'
          unzip -p "$APK" assets/mirror-mobile.css | grep -q 'mirror-grid'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee mobile-android/app/build/outputs/apk/debug/Gridium-Mobile-2.5-validation.txt
          grep -q "versionName='2.5.0'" mobile-android/app/build/outputs/apk/debug/Gridium-Mobile-2.5-validation.txt
          sha256sum mobile-android/app/build/outputs/apk/debug/app-debug.apk | tee mobile-android/app/build/outputs/apk/debug/Gridium-Mobile-2.5-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Mobile-2.5-Mirroring
          path: |
            mobile-android/app/build/outputs/apk/debug/app-debug.apk
            mobile-android/app/build/outputs/apk/debug/Gridium-Mobile-2.5-SHA256.txt
            mobile-android/app/build/outputs/apk/debug/Gridium-Mobile-2.5-validation.txt
