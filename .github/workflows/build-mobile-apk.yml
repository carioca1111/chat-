name: Build Gridium 2 Mobile Alpha 1.1

on:
  workflow_dispatch:
  push:
    branches: [gridium2-mobile-full-dashboard]
    paths:
      - 'mobile-android/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('mobile-android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',html)
          assert scripts, 'inline script not found'
          Path('/tmp/gridium-mobile.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/gridium-mobile.js
          grep -q 'HUNT INTELLIGENCE' mobile-android/app/src/main/assets/index.html
          grep -q 'SOMENTE LEITURA' mobile-android/app/src/main/assets/index.html
          grep -q 'setAllowUniversalAccessFromFileURLs(true)' mobile-android/app/src/main/java/com/pokegrid/mobile/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: mobile-android
        run: gradle assembleDebug
      - name: Verify and name APK
        run: |
          SRC=mobile-android/app/build/outputs/apk/debug/app-debug.apk
          OUT=mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"
          unzip -t "$OUT"
          unzip -p "$OUT" assets/index.html | grep -q 'Gridium 2 Mobile'
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$OUT"
          "$BUILD_TOOLS/aapt" dump badging "$OUT" | tee mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1-validation.txt
          grep -q "versionName='3.0.0-alpha.1.1'" mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1-validation.txt
          sha256sum "$OUT" | tee mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Mobile-Alpha-1.1
          path: |
            mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1.apk
            mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1-SHA256.txt
            mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1-validation.txt
          retention-days: 90
      - name: Publish APK release
        if: ${{ startsWith(github.event.head_commit.message, 'release-mobile:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-mobile-v3.0.0-alpha.1.1
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Mobile Alpha 1.1 · Relay Fix
          body: |
            Gridium 2 Mobile Alpha 1.1 — correção do falso “Relay offline”.

            - mantém o dashboard local do APK
            - libera a comunicação HTTPS necessária com o relay dentro do WebView
            - remove a dependência AndroidX adicionada na tentativa anterior
            - mantém dashboard completo, Hunt, Sentinel, Market e notificações
            - mantém pareamento e token já salvo quando válido

            Requer Gridium 2 Alpha 1.3 ou superior no PC com Mobile Sync configurado.
          prerelease: false
          files: mobile-android/app/build/outputs/apk/debug/Gridium-2-Mobile-Alpha-1.1.apk
