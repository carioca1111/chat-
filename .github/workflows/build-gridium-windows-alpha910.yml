name: Build Gridium Windows Alpha 9.10

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'apply-alpha910.js'
      - 'alpha910-parts/**'
      - 'build-alpha910.ps1'
      - '.github/workflows/build-gridium-windows-alpha910.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Alpha 9.10
        shell: pwsh
        run: ./build-alpha910.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.10
          path: gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.10.exe
          if-no-files-found: error
          retention-days: 30
