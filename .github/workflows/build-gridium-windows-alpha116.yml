name: Build Gridium Alpha 11.6 Lightning Latency

on:
  pull_request:
    branches: [gridium-next]
    paths: ['alpha116-*.js', 'alpha116-parts/**', 'alpha116-src/**', 'build-alpha116.ps1', '.github/workflows/build-gridium-windows-alpha116.yml']
  push:
    branches: [gridium-alpha11.6-lightning-latency]
    paths: ['alpha116-*.js', 'alpha116-parts/**', 'alpha116-src/**', 'build-alpha116.ps1', '.github/workflows/build-gridium-windows-alpha116.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble Alpha 11.6 from clean Alpha 11.5
        shell: pwsh
        run: ./build-alpha116.ps1
      - name: Install build dependencies
        working-directory: gridium-build
        run: npm install --no-audit --no-fund
      - name: Compile TypeScript and C++ Sniper engines
        shell: pwsh
        run: ./build-sniper-alpha913.ps1
      - name: Full regression suite
        working-directory: gridium-build
        shell: pwsh
        run: |
          & node --test --test-timeout=30000 test/*.test.js 2>&1 | Tee-Object -FilePath regression-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Alpha-11.6-Regression-Diagnostics
          path: |
            gridium-build/regression-output.txt
            gridium-build/main.js
            gridium-build/network-inspector.js
            gridium-build/sniper-runtime.js
            gridium-build/sniper-ui.js
            gridium-build/market-live.js
            gridium-build/market-protocol.js
            gridium-build/test/*.test.js
            alpha116-before.json
            alpha116-after.json
          if-no-files-found: warn
          retention-days: 7
      - name: Windows installer
        working-directory: gridium-build
        run: npx electron-builder --win nsis --publish never
      - name: Verify packaged app.asar and installer
        shell: pwsh
        run: |
          $file = Get-Item 'gridium-build/dist/Gridium-Setup-3.0.0-alpha.11.6.exe'
          if ($file.Length -lt 50000000) { throw 'Installer is incomplete' }
          if (-not (Test-Path 'gridium-build/alpha112-benchmark.json')) { throw 'Performance guard missing' }
          if (-not (Test-Path 'alpha116-before.json')) { throw 'Alpha 11.6 baseline benchmark missing' }
          if (-not (Test-Path 'alpha116-after.json')) { throw 'Alpha 11.6 optimized benchmark missing' }
          $normal=(Get-ChildItem 'gridium-build/assets/sniper/pokemon/normal' -Filter *.png).Count
          $shiny=(Get-ChildItem 'gridium-build/assets/sniper/pokemon/shiny' -Filter *.png).Count
          if ($normal -lt 900 -or $shiny -lt 700) { throw "Sprite library incomplete: normal=$normal shiny=$shiny" }
          $asar='gridium-build/dist/win-unpacked/resources/app.asar'
          if (-not (Test-Path $asar)) { throw 'app.asar missing' }
          npx asar extract $asar 'gridium-build/dist/asar-check'
          $pkg=Get-Content 'gridium-build/dist/asar-check/package.json' -Raw | ConvertFrom-Json
          if ($pkg.version -ne '3.0.0-alpha.11.6') { throw "Packaged version mismatch: $($pkg.version)" }
          $main=Get-Content 'gridium-build/dist/asar-check/main.js' -Raw
          $runtime=Get-Content 'gridium-build/dist/asar-check/sniper-runtime.js' -Raw
          if ($main -notmatch 'alphaEngine\?\.validation') { throw 'Direct validation missing from app.asar' }
          $waitStart=$main.IndexOf('async function waitMarketOutcome')
          $waitEnd=$main.IndexOf('function autoSellPrice',$waitStart)
          if ($waitStart -lt 0 -or $waitEnd -le $waitStart) { throw 'waitMarketOutcome missing from app.asar' }
          $waitBody=$main.Substring($waitStart,$waitEnd-$waitStart)
          if ($waitBody -notmatch 'beginMarketOutcomeWait') { throw 'Event-driven outcome waiter missing from waitMarketOutcome in app.asar' }
          if ($waitBody -match 'sleep\(140\)') { throw 'Legacy 140ms confirmation polling found inside waitMarketOutcome in app.asar' }
          if ($runtime -notmatch 'PREPARED') { throw 'PREPARED dispatch state missing from app.asar' }
          "version=$($pkg.version)" | Set-Content 'gridium-build/asar-verification.txt'
          "directValidation=true" | Add-Content 'gridium-build/asar-verification.txt'
          "eventDrivenOutcome=true" | Add-Content 'gridium-build/asar-verification.txt'
          "preparedState=true" | Add-Content 'gridium-build/asar-verification.txt'
          Get-FileHash $file.FullName -Algorithm SHA256
          Get-Content 'alpha116-before.json'
          Get-Content 'alpha116-after.json'
          Get-Content 'gridium-build/alpha112-benchmark.json'
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Alpha-11.6-Lightning-Latency-Windows
          path: |
            gridium-build/dist/Gridium-Setup-3.0.0-alpha.11.6.exe
            alpha116-before.json
            alpha116-after.json
            gridium-build/alpha112-benchmark.json
            gridium-build/sniper-benchmark.json
            gridium-build/asar-verification.txt
          if-no-files-found: error
          retention-days: 30
