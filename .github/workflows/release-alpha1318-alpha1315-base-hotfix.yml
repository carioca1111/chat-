name: Release Gridium 2 Alpha 1.3.18 - 1.3.15 Base Hotfix

on:
  push:
    branches:
      - fix/alpha1315-server-recognition-hotfix
    paths:
      - '.github/workflows/release-alpha1318-alpha1315-base-hotfix.yml'
      - '.github/scripts/apply-alpha1318-from-alpha1315-server-fix.mjs'
      - 'gridium2/tests/server-recognition-alpha1315-base.test.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact Alpha 1.3.15 based branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Verify branch still descends from released Alpha 1.3.15
        shell: pwsh
        run: |
          git merge-base --is-ancestor ba50d25526b2d36aadae4d572b7bbeb6ea485b50 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Branch is no longer based on released Alpha 1.3.15' }

      - name: Apply minimal server recognition hotfix
        run: node .github/scripts/apply-alpha1318-from-alpha1315-server-fix.mjs

      - name: Assert no reload watchdog was introduced
        shell: pwsh
        run: |
          $src = Get-Content gridium2/src/main/account-runtime.ts -Raw
          if ($src.Contains('scheduleServerMonitorRecovery') -or $src.Contains('recoverServerMonitor') -or $src.Contains('monitorRecoveryAttempts')) {
            throw 'Forbidden reload watchdog code detected'
          }

      - name: Install dependencies
        working-directory: gridium2
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: gridium2
        run: npm run typecheck

      - name: Targeted server recognition regression
        working-directory: gridium2
        run: npx vitest run tests/server-recognition-alpha1315-base.test.ts

      - name: Full unit tests
        working-directory: gridium2
        run: npm test

      - name: Long-running soak with GC
        working-directory: gridium2
        run: npm run test:soak

      - name: Electron lifecycle regression
        working-directory: gridium2
        run: npm run test:electron

      - name: Commit fixed release source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/package.json gridium2/package-lock.json gridium2/electron-builder.yml gridium2/src/main/account-runtime.ts gridium2/src/main/index.ts gridium2/src/renderer/index.html gridium2/src/renderer/src/App.tsx
          git diff --cached --check
          git commit -m "release: Gridium 2 Alpha 1.3.18 from Alpha 1.3.15 base hotfix"
          git push origin HEAD:fix/alpha1315-server-recognition-hotfix

      - name: Build Electron app
        working-directory: gridium2
        run: npm run build

      - name: Build Windows installer
        working-directory: gridium2
        run: npx electron-builder --win nsis --x64

      - name: Verify installer and create update manifest
        shell: pwsh
        working-directory: gridium2
        run: |
          $installer = 'release/Gridium-2-Alpha-1.3.18-Setup.exe'
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = '2.0.0-alpha.13.18'; installer = 'Gridium-2-Alpha-1.3.18-Setup.exe'; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path 'release/gridium2-update.json' -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.18-Alpha1315-Base-Hotfix-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.18-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Gridium 2 Alpha 1.3.18
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v2.0.0-alpha.13.18
          target_commitish: fix/alpha1315-server-recognition-hotfix
          name: Gridium 2 Alpha 1.3.18 · Alpha 1.3.15 Base Server Recognition Hotfix
          body: |
            Esta build usa exatamente a release Alpha 1.3.15 como base e corrige somente o reconhecimento do servidor nas contas 2/3/4.

            - base exata: Alpha 1.3.15 (commit ba50d25526b2d36aadae4d572b7bbeb6ea485b50)
            - ativa CDP/Network nas quatro contas antes do primeiro carregamento do PokeIdle
            - preserva os request IDs dos WebSockets durante loads/navegacoes normais do jogo
            - evita perder o socket quando um modal ou fluxo interno dispara did-start-loading
            - continua limpando o estado quando o renderer realmente cai
            - NAO inclui watchdog de recuperacao
            - NAO inclui reload automatico
            - NAO traz as mudancas da Alpha 1.3.16 ou Alpha 1.3.17
            - preserva Hunt, shiny, poções/revives headless, mobile sync, painel e otimizações da 1.3.15
            - typecheck, regressao especifica, suite completa, soak com GC e regressao Electron executados antes da publicacao
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.18-Setup.exe
            gridium2/release/gridium2-update.json
