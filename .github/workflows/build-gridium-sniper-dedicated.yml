name: Build Gridium Sniper Dedicated

on:
  pull_request:
    branches: [gridium-next]
    paths:
      - 'sniper-dedicated-src/**'
      - 'alpha917-src/**'
      - 'apply-alpha917.js'
      - 'build-alpha917.ps1'
      - 'apply-sniper-dedicated.js'
      - 'apply-sniper-budget-persistence.js'
      - 'prepare-sniper-alpha917.js'
      - 'apply-sniper-opportunities.js'
      - 'normalize-sniper-ux3-inputs.js'
      - 'apply-sniper-ux3.js'
      - 'fix-sniper-ux3-test.js'
      - 'build-sniper-dedicated.ps1'
      - '.github/workflows/build-gridium-sniper-dedicated.yml'
  push:
    branches: [gridium-next]
    paths:
      - 'sniper-dedicated-src/**'
      - 'alpha917-src/**'
      - 'apply-alpha917.js'
      - 'build-alpha917.ps1'
      - 'apply-sniper-dedicated.js'
      - 'apply-sniper-budget-persistence.js'
      - 'prepare-sniper-alpha917.js'
      - 'apply-sniper-opportunities.js'
      - 'normalize-sniper-ux3-inputs.js'
      - 'apply-sniper-ux3.js'
      - 'fix-sniper-ux3-test.js'
      - 'build-sniper-dedicated.ps1'
      - '.github/workflows/build-gridium-sniper-dedicated.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble dedicated sniper
        shell: pwsh
        run: ./build-sniper-dedicated.ps1
      - name: Install desktop dependencies
        shell: pwsh
        working-directory: gridium-build
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        shell: pwsh
        working-directory: gridium-build
        run: npx electron-builder --win nsis --publish never
      - name: Verify installer
        shell: pwsh
        run: |
          $file='gridium-build/dist/Gridium-Sniper-Setup-3.0.0-sniper.3.exe'
          if(!(Test-Path $file)){ throw "Installer not found: $file" }
          $item=Get-Item $file
          if($item.Length -lt 50000000){ throw "Installer too small: $($item.Length) bytes" }
          $hash=Get-FileHash $file -Algorithm SHA256
          "Installer bytes: $($item.Length)"
          "Installer SHA256: $($hash.Hash)"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Sniper-3.0.0-sniper.3-Windows
          path: gridium-build/dist/Gridium-Sniper-Setup-3.0.0-sniper.3.exe
          if-no-files-found: error
          retention-days: 30
