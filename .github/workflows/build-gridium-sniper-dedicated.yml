name: Build Gridium Sniper Dedicated

on:
  pull_request:
    branches: [gridium-next]
    paths:
      - 'sniper-dedicated-src/**'
      - 'apply-sniper-dedicated.js'
      - 'build-sniper-dedicated.ps1'
      - '.github/workflows/build-gridium-sniper-dedicated.yml'
  push:
    branches: [gridium-next]
    paths:
      - 'sniper-dedicated-src/**'
      - 'apply-sniper-dedicated.js'
      - 'build-sniper-dedicated.ps1'
      - '.github/workflows/build-gridium-sniper-dedicated.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Assemble dedicated sniper
        shell: pwsh
        run: ./build-sniper-dedicated.ps1
      - name: Install desktop dependencies
        shell: pwsh
        working-directory: gridium-build
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        shell: pwsh
        working-directory: gridium-build
        run: npx electron-builder --win nsis --publish never
      - name: Verify installer
        shell: pwsh
        run: |
          $file='gridium-build/dist/Gridium-Sniper-Setup-3.0.0-sniper.1.exe'
          if(!(Test-Path $file)){ throw "Installer not found: $file" }
          Get-Item $file | Format-List Name,Length,LastWriteTime
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Sniper-3.0.0-sniper.1-Windows
          path: gridium-build/dist/Gridium-Sniper-Setup-3.0.0-sniper.1.exe
          if-no-files-found: error
