name: Export Alpha96 Runtime
on: workflow_dispatch
jobs:
  export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: ./export-alpha96-runtime.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Alpha96-Runtime
          path: alpha96-runtime.zip
