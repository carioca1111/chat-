name: Build Gridium 2 Mobile Hunt Control

on:
  push:
    branches:
      - gridium2-mobile-hunt-control
    paths:
      - 'mobile-android/**'
      - '.github/workflows/build-gridium2-mobile-hunt-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hunt Control JS tests
        run: node --test mobile-android/test/*.test.cjs
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: mobile-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        shell: bash
        run: |
          test -f mobile-android/app/build/outputs/apk/debug/app-debug.apk
          cp mobile-android/app/build/outputs/apk/debug/app-debug.apk Gridium-2-Mobile-Alpha-1.3-Hunt-Control.apk
          sha256sum Gridium-2-Mobile-Alpha-1.3-Hunt-Control.apk | tee Gridium-2-Mobile-Alpha-1.3-Hunt-Control.sha256
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Mobile-Alpha-1.3-Hunt-Control
          path: |
            Gridium-2-Mobile-Alpha-1.3-Hunt-Control.apk
            Gridium-2-Mobile-Alpha-1.3-Hunt-Control.sha256
          retention-days: 90
      - name: Publish mobile release
        if: ${{ startsWith(github.event.head_commit.message, 'release-mobile:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-mobile-v3.0.0-alpha.1.3
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Mobile Alpha 1.3 · Hunt Control
          body: |
            Gridium 2 Mobile Alpha 1.3 adiciona uma área Hunt Control completa e leve, alimentada pelo relay do Desktop.

            - visão individual por conta e agrupamento automático de contas na mesma Hunt
            - capturas totais e por hora, abates estimados e por hora, duração da sessão
            - metas editáveis de capturas e abates, faltantes, progresso e ETA
            - P1–P5, shiny visto e shiny capturado
            - estoque/consumo de poções e revives, revives previstos após as poções e ETA do Centro
            - status “como estamos indo” com Hunt estável/atenção/Centro logo
            - timeline de próximos marcos e contribuição de cada conta no grupo
            - substitui a antiga aba Market do APK por Hunt Ctrl
            - cálculo feito sobre o snapshot compacto enviado pelo Desktop; o Android não processa roster nem eventos pesados
            - requer Gridium 2 Desktop Alpha 1.3.9 ou superior para todas as métricas de sustain
            - testes Node do cálculo/sintaxe + build Android executados antes da publicação
          files: |
            Gridium-2-Mobile-Alpha-1.3-Hunt-Control.apk
            Gridium-2-Mobile-Alpha-1.3-Hunt-Control.sha256
