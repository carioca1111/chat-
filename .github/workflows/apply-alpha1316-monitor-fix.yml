name: Apply Alpha 1.3.16 Multi Account Monitor Fix

on:
  push:
    branches:
      - fix/multi-account-server-monitor
    paths:
      - '.github/workflows/apply-alpha1316-monitor-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply deterministic monitor patch
        run: node .github/scripts/apply-alpha1316-monitor-fix.mjs
      - name: Validate patched source
        working-directory: gridium2
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx vitest run tests/account-server-monitor.test.ts
      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/src/main/account-runtime.ts
          git diff --cached --check
          git commit -m "fix: stabilize four-account PokeIdle server monitor"
          git push origin HEAD:fix/multi-account-server-monitor
