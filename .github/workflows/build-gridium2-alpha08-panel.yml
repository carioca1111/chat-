name: Build Gridium 2 Stable Hunt Sessions

on:
  push:
    branches:
      - gridium2-mobile-full-dashboard
      - fix/long-running-performance
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Long-running soak with GC
        run: npm run test:soak
      - name: Electron lifecycle regression
        run: npm run test:electron
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-performance-evidence
          path: gridium2/docs/performance/*.json
      - name: Build Electron app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.3.5-Setup.exe" >> $env:GITHUB_OUTPUT
      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = "${{ steps.meta.outputs.version }}"; installer = "${{ steps.meta.outputs.installer }}"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.5-Stable-Hunt-Sessions-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.5-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.3.5 · Hunt Session Stability
          body: |
            Gridium 2 Alpha 1.3.5 estabiliza e otimiza a Hunt Control.

            - Hunt Control não zera mais em reload, reconexão, queda do renderer ou perda temporária do monitor
            - a sessão só é encerrada quando o servidor informa saída real da Hunt, troca para outra Hunt ou troca de conta
            - pacotes parciais sem huntSlug não são mais interpretados como saída da Hunt
            - variações de maiúsculas, hífen e espaço no identificador da mesma Hunt não reiniciam os contadores
            - welcome/reconexão preserva capturas, P1-P5, shiny, abates, poções e tempo de sessão
            - ledger exato de Pokémon permanece preservado durante reconexões para evitar recapturas falsas
            - filas de eventos da última hora usam poda por índice e compactação eventual, reduzindo alocações
            - snapshot de poções usa cache por revisão e só recalcula quando o inventário muda
            - fora de uma Hunt, estados completos deixam de alimentar o ledger da Hunt desnecessariamente
            - estado da sessão possui representação compacta para persistência sem carregar histórico ilimitado
            - HUNT original continua separada da HUNT CTRL e AutoMarket continua removido
            - typecheck, testes, soak com GC e regressão Electron executados no Windows antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.5-Setup.exe
            gridium2/release/gridium2-update.json
