name: Build Gridium 2 Vale a Pena XP Intelligence

on:
  push:
    branches:
      - gridium2-mobile-full-dashboard
      - fix/long-running-performance
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Long-running soak with GC
        run: npm run test:soak
      - name: Electron lifecycle regression
        run: npm run test:electron
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-performance-evidence
          path: gridium2/docs/performance/*.json
      - name: Build Electron app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.3.7-Setup.exe" >> $env:GITHUB_OUTPUT
      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = "${{ steps.meta.outputs.version }}"; installer = "${{ steps.meta.outputs.installer }}"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.7-Vale-a-Pena-XP-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.7-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.3.7 · Vale a Pena XP Intelligence
          body: |
            Gridium 2 Alpha 1.3.7 completa a aba Vale a Pena com a camada de decisão por XP/h e retorno.

            - mantém CONTAS, HUNT, HUNT CTRL, VALE A PENA e PAINEL
            - Pokémon A passa a ser tratado como o seu atual e Pokémon B como o candidato
            - calcula XP/h do seu Pokémon hoje e XP/h do candidato no nível atual
            - projeta o candidato no seu nível e mostra ganho ou perda percentual de XP/h
            - calcula o primeiro nível em que o candidato empata o seu XP/h e o tempo até esse ponto
            - calcula tempo de caça até o candidato chegar ao nível do seu Pokémon, sem bônus de XP
            - integra a perda de XP antes do empate e calcula o tempo de retorno para recuperar essa diferença
            - mostra a rota de Hunts do candidato, com faixa de níveis, XP/h inicial/final e duração por etapa
            - adiciona preço manual em gemas ou ouro e mostra ganho de XP/h por unidade de preço
            - usa um Índice Gridium /10 baseado em ganho, desvantagem atual e retorno; não inventa histórico global de Mercado
            - Mercado 30d fica explicitamente marcado como não conectado até existir fonte real de vendas, mediana e preço típico
            - cálculos pesados rodam em Web Worker para não bloquear as quatro contas nem a interface
            - usa o XP absoluto do Pokémon da conta quando disponível para melhorar a ETA de evolução
            - preserva a comparação técnica de stats e a colagem de ficha externa da Alpha 1.3.6
            - typecheck, testes unitários, soak com GC e regressão Electron executados no Windows antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.7-Setup.exe
            gridium2/release/gridium2-update.json
