name: Build Gridium 2 Vale a Pena

on:
  push:
    branches:
      - gridium2-mobile-full-dashboard
      - fix/long-running-performance
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Long-running soak with GC
        run: npm run test:soak
      - name: Electron lifecycle regression
        run: npm run test:electron
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-performance-evidence
          path: gridium2/docs/performance/*.json
      - name: Build Electron app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.3.6-Setup.exe" >> $env:GITHUB_OUTPUT
      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = "${{ steps.meta.outputs.version }}"; installer = "${{ steps.meta.outputs.installer }}"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.6-Vale-a-Pena-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.6-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.3.6 · Vale a Pena
          body: |
            Gridium 2 Alpha 1.3.6 adiciona o comparador Vale a Pena.

            - remove SHINY, MARKET e SNIPER da barra superior
            - adiciona a aba VALE A PENA entre Hunt Control e Painel
            - compara Pokémon das quatro contas usando dados reais já recebidos do servidor
            - busca do roster é sob demanda e limitada, sem colocar milhares de Pokémon no snapshot contínuo do app
            - permite comparar conta × conta, inclusive Pokémon de contas diferentes
            - permite colar uma ficha externa no formato Markdown do PokeIdle e extrai espécie, nível, potência, qualidade, IVs e stats
            - compara força atual e projeta ambos para o mesmo nível
            - aplica a regra PokeIdle fornecida para base + refino + IV, qualidade, potência, shiny e lendário quando necessário
            - mostra vencedor por stat, total de stats, diferença percentual e veredito transparente
            - ficha externa é processada localmente e não é persistida
            - Hunt Control e otimizações da Alpha 1.3.5 permanecem preservadas
            - typecheck, testes, soak com GC e regressão Electron executados no Windows antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.6-Setup.exe
            gridium2/release/gridium2-update.json
