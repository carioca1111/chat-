name: Build Gridium 2 Hunt Intelligence

on:
  push:
    branches:
      - gridium2-mobile-full-dashboard
      - fix/long-running-performance
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Long-running soak with GC
        run: npm run test:soak
      - name: Electron lifecycle regression
        run: npm run test:electron
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-performance-evidence
          path: gridium2/docs/performance/*.json
      - name: Build Electron app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.3.2-Setup.exe" >> $env:GITHUB_OUTPUT
      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = "${{ steps.meta.outputs.version }}"; installer = "${{ steps.meta.outputs.installer }}"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.2-Hunt-Intelligence-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.2-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.3.2 · Hunt Intelligence
          body: |
            Gridium 2 Alpha 1.3.2 — Hunt Control compacto para acompanhar a sessão em tempo real.

            - capturas, capturas/h e meta com progresso/ETA
            - abates estimados por ganho confirmado de XP e abates/h
            - P1, P2, P3, P4 e P5 por Hunt
            - shiny visto e shiny capturado por Hunt
            - estoque/uso de poções e ETA de retorno ao Centro Pokémon
            - visual individual, quatro contas e grupo de contas na mesma Hunt
            - estatísticas combinadas e contribuição de cada conta no grupo
            - sprites dos Pokémon e imagens dos itens
            - rota perfeita existente preservada abaixo do novo painel compacto
            - recurso antigo de compra automática removido por completo
            - typecheck, testes, soak com GC e regressão Electron executados no Windows antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.2-Setup.exe
            gridium2/release/gridium2-update.json
