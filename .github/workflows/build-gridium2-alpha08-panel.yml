name: Build Gridium 2 Alpha 1.2.2 Farm Gold Only

on:
  push:
    branches:
      - gridium2-alpha1.2.2-farm-gold-only
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout Alpha 1.2.2 branch
        uses: actions/checkout@v4
        with:
          ref: gridium2-alpha1.2.2-farm-gold-only

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build Electron app
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64

      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.2.2-Setup.exe" >> $env:GITHUB_OUTPUT

      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = "${{ steps.meta.outputs.version }}"
            installer = "${{ steps.meta.outputs.installer }}"
            sha256 = $hash
          } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
          Get-Content "release/gridium2-update.json"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.2.2-Farm-Gold-Only-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.2.2-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.2.2 · Farm Gold Only
          body: |
            Gridium 2 Alpha 1.2.2 — Gold ganho passa a representar apenas Gold de farm/jogo.

            - vendas de Pokémon no Market não entram mais em Gold ganho
            - vendas de itens no Market também são excluídas do Gold ganho
            - RMT continua separado em R$ e nunca contamina Gold ganho
            - quando venda e farm chegam no mesmo saldo, apenas a parte de farm é contabilizada
            - histórico antigo é migrado removendo receita Market já registrada
            - mantém o updater 1.2.1, Predictive Hunt, Sentinel, Detector, Hunt Learning e WhatsApp
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.2.2-Setup.exe
            gridium2/release/gridium2-update.json