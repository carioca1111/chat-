name: Build Gridium 2 Headless Supply Inference

on:
  push:
    branches:
      - gridium2-mobile-full-dashboard
      - fix/long-running-performance
      - fix/shiny-ball-events
      - fix/supply-protocol
      - fix/potion-effect-catalog
      - fix/potion-revive-live-protocol
      - fix/potion-revive-ui-fallback
    paths:
      - 'gridium2/**'
      - '.github/workflows/build-gridium2-alpha08-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gridium2
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Long-running soak with GC
        run: npm run test:soak
      - name: Electron lifecycle regression
        run: npm run test:electron
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-performance-evidence
          path: gridium2/docs/performance/*.json
      - name: Build Electron app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=Gridium-2-Alpha-1.3.15-Setup.exe" >> $env:GITHUB_OUTPUT
      - name: Verify installer and create update manifest
        shell: pwsh
        run: |
          $installer = Join-Path "release" "${{ steps.meta.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = "${{ steps.meta.outputs.version }}"; installer = "${{ steps.meta.outputs.installer }}"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          Write-Host "SHA256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.15-Headless-Supply-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.15-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish Gridium update release
        if: ${{ startsWith(github.event.head_commit.message, 'release:') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Gridium 2 Alpha 1.3.15 · Headless Potion/Revive Inference
          body: |
            Gridium 2 Alpha 1.3.15 remove a dependência de leitura da UI para poções e revives.

            - remove o scanner de DOM introduzido na Alpha 1.3.14
            - continua funcionando com painéis do PokeIdle fechados e sem manter controles visíveis
            - aprende IDs de consumíveis pelo efeito real no HP do pokemon
            - mapeia 60 HP = Small Potion, 150 = Great Potion, 400 = Ultra Potion, 1000 = Hyper Potion e 3000 = Ultimate Potion
            - reconhece Golden Potion pela restauração de 50% quando o efeito não está truncado pelo HP máximo
            - reconhece Revive por retorno aproximado a 10% do HP máximo e Max Revive por retorno ao HP cheio
            - depois de aprender o ID, reaproveita o protocolo bruto para recuperar estoque mesmo sem nome de exibição
            - evita inferência quando a cura bate no teto de HP e o tipo da poção fica ambíguo
            - mantém o parser WebSocket anterior como fonte principal e usa a inferência apenas para preencher IDs sem nome
            - preserva shiny, Hunt, mobile sync, painel e otimizações anteriores
            - typecheck, testes unitários, soak com GC e regressão Electron executados no Windows antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.15-Setup.exe
            gridium2/release/gridium2-update.json
