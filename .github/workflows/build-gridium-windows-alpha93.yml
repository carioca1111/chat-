name: Build Gridium Windows Alpha 9.3

on:
  push:
    branches:
      - gridium-next
    paths:
      - '.github/workflows/build-gridium-windows-alpha93.yml'
      - 'apply-alpha93.js'
      - 'alpha-core-process-93.js'
      - 'alpha93-repair-crlf.js'
      - 'build-alpha93.ps1'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Alpha 9.3
        shell: pwsh
        run: ./build-alpha93.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.3
          path: gridium-build/dist/*.exe
          if-no-files-found: error
          retention-days: 30
