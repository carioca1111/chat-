name: Apply current potion catalog fix

on:
  push:
    branches:
      - fix/potion-effect-catalog
    paths:
      - '.github/workflows/apply-potion-effect-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Fix patch script quoting
        run: node .github/scripts/fix-potion-patch-script.mjs
      - name: Apply deterministic source patch
        run: node .github/scripts/apply-potion-effect-fix.mjs
      - name: Harden generated effect regexes
        run: node .github/scripts/fix-generated-potion-regex.mjs
      - name: Install dependencies
        working-directory: gridium2
        run: npm install --no-audit --no-fund
      - name: Focused validation
        working-directory: gridium2
        run: |
          npm run typecheck
          npx vitest run tests/hunt-session-runtime.test.ts
      - name: Commit and push patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/src/main/hunt-session-runtime.ts gridium2/tests/hunt-session-runtime.test.ts
          git diff --cached --check
          git commit -m "fix: identify all current potions by effect"
          git push origin HEAD:fix/potion-effect-catalog
