name: Decode Alpha 9.11 Diagnostic

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'decode-alpha911.js'
      - '.github/workflows/decode-alpha911.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode Alpha 9.11 payload
        run: node decode-alpha911.js
      - name: Commit readable diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f alpha911-readable.js
          git commit -m "Decode Alpha 9.11 patch for diagnostics" || exit 0
          git push origin HEAD:gridium-next
