name: Apply Alpha 1.3.16 Version

on:
  push:
    branches:
      - fix/multi-account-server-monitor
    paths:
      - '.github/workflows/apply-alpha1316-version.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Apply version bump
        run: node .github/scripts/bump-alpha1316.mjs
      - name: Validate versioned source
        working-directory: gridium2
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx vitest run tests/account-server-monitor.test.ts
      - name: Commit versioned release source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/package.json gridium2/electron-builder.yml gridium2/src/renderer/src/App.tsx gridium2/src/renderer/index.html gridium2/src/main/index.ts
          git diff --cached --check
          git commit -m "chore: bump Gridium 2 Alpha 1.3.16"
          git push origin HEAD:fix/multi-account-server-monitor
