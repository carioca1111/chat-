name: Build Gridium Windows Alpha 9.14 Responsiveness

on:
  push:
    branches: [gridium-next]
    paths:
      - 'alpha914-src/**'
      - 'alpha914-benchmark.js'
      - 'apply-alpha914.js'
      - 'build-alpha914.ps1'
      - '.github/workflows/build-gridium-windows-alpha914.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: minimal

      - name: Assemble and profile Alpha 9.14
        shell: pwsh
        run: ./build-alpha914.ps1

      - name: Install dependencies
        working-directory: gridium-build
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Compile independent Sniper engines
        shell: pwsh
        run: ./build-sniper-alpha913.ps1

      - name: Validate payload and run complete suite
        working-directory: gridium-build
        shell: pwsh
        run: |
          if ((Get-Content package.json -Raw) -notmatch '3.0.0-alpha.9.14') { throw 'Alpha 9.14 version missing' }
          if (-not (Test-Path 'perf-runtime.js')) { throw 'Alpha 9.14 perf runtime missing' }
          if (-not (Test-Path 'sniper/engine.js')) { throw 'TypeScript Sniper engine missing' }
          if (-not (Test-Path 'sniper-native/sniper-core.exe')) { throw 'C++ Sniper engine missing' }
          node --check main.js
          node --check renderer.js
          node --check alpha-engine.js
          node --check perf-runtime.js
          npm test

      - name: Build Windows installer
        working-directory: gridium-build
        shell: pwsh
        run: npm run dist:win

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-Item 'gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.14.exe'
          if ($installer.Length -lt 50000000) { throw "Installer too small: $($installer.Length) bytes" }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "Installer bytes: $($installer.Length)"
          "Installer SHA256: $($hash.Hash)"

      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.14
          path: gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.14.exe
          if-no-files-found: error
          retention-days: 30
