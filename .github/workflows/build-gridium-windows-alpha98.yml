name: Build Gridium Windows Alpha 9.8

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'apply-alpha98.js'
      - 'alpha98-parts/**'
      - 'build-alpha98.ps1'
      - '.github/workflows/build-gridium-windows-alpha98.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Alpha 9.8
        shell: pwsh
        run: ./build-alpha98.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.8
          path: gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.8.exe
          retention-days: 30
