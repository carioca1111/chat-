name: Build Gridium Windows Alpha 9.9

on:
  push:
    branches:
      - gridium-next
    paths:
      - 'apply-alpha99.js'
      - 'alpha99-parts/**'
      - 'build-alpha99.ps1'
      - '.github/workflows/build-gridium-windows-alpha99.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Alpha 9.9
        shell: pwsh
        run: ./build-alpha99.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Gridium-Setup-3.0.0-alpha.9.9
          path: gridium-build/dist/Gridium-Setup-3.0.0-alpha.9.9.exe
          if-no-files-found: error
          retention-days: 30
