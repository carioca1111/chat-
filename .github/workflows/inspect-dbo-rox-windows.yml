name: Inspect DBO Rox Windows package

on:
  push:
    branches: [dbo-dev-bridge-alpha01]
    paths:
      - '.github/workflows/inspect-dbo-rox-windows.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve and download original DBO Rox packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path inspect | Out-Null
          @'
          import fs from 'node:fs';
          import { pipeline } from 'node:stream/promises';
          import { createWriteStream } from 'node:fs';

          const packages = {
            client: 'https://www.mediafire.com/file/ykfc9vo7fiq2flt/Dbo_Rox_Client.rar/file',
            server: 'https://www.mediafire.com/file/46j6dywwv8mtv4j/DboRox.rar/file'
          };

          function decodeHtml(v) {
            return v.replaceAll('&amp;', '&').replaceAll('&#x2F;', '/').replaceAll('&#47;', '/');
          }

          async function download(pageUrl, out) {
            const page = await fetch(pageUrl, { redirect: 'follow', headers: { 'user-agent': 'Mozilla/5.0 Chrome/156' }});
            if (!page.ok) throw new Error(`MediaFire page ${page.status}`);
            const html = await page.text();
            const matches = [
              html.match(/href=["'](https:\/\/download[^"']+)["'][^>]*>\s*Download/i),
              html.match(/aria-label=["']Download file["'][^>]*href=["']([^"']+)/i),
              html.match(/href=["'](https:\/\/download[^"']+mediafire\.com[^"']+)["']/i),
            ].filter(Boolean);
            if (!matches.length) throw new Error(`Direct URL not found for ${pageUrl}`);
            const direct = decodeHtml(matches[0][1]);
            const res = await fetch(direct, { redirect: 'follow', headers: { 'user-agent': 'Mozilla/5.0 Chrome/156' }});
            if (!res.ok || !res.body) throw new Error(`Download failed ${res.status}`);
            await pipeline(res.body, createWriteStream(out));
            console.log(`${out}: ${fs.statSync(out).size} bytes`);
          }

          for (const [name, url] of Object.entries(packages)) await download(url, `inspect/${name}.rar`);
          '@ | Set-Content -Encoding UTF8 inspect/download.mjs
          node inspect/download.mjs

      - name: Extract archives
        shell: pwsh
        run: |
          7z x inspect/client.rar -oinspect/client -y
          7z x inspect/server.rar -oinspect/server -y

      - name: Inspect client assets and version hints
        shell: pwsh
        run: |
          $out = @()
          $out += '=== DAT / SPR / OTFI ==='
          Get-ChildItem inspect/client -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '^\.(dat|spr|otfi)$' } | ForEach-Object {
            $rel = $_.FullName.Replace((Get-Location).Path + '\','')
            $out += "$rel`t$($_.Length)"
          }
          $out += ''
          $out += '=== THINGS DIRECTORIES ==='
          Get-ChildItem inspect/client -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '[\\/]things([\\/]|$)' } | ForEach-Object {
            $out += $_.FullName.Replace((Get-Location).Path + '\','')
          }
          $out += ''
          $out += '=== VERSION HINTS IN TEXT FILES ==='
          Get-ChildItem inspect/client -Recurse -File -Include *.lua,*.otmod,*.txt,*.cfg,*.ini -ErrorAction SilentlyContinue | ForEach-Object {
            $hits = Select-String -Path $_.FullName -Pattern '854|860|8\.54|8\.60|setClientVersion|setProtocolVersion|setClientVersionOverride|things/' -ErrorAction SilentlyContinue
            foreach ($h in $hits) {
              $rel = $_.FullName.Replace((Get-Location).Path + '\','')
              $out += "${rel}:$($h.LineNumber): $($h.Line.Trim())"
            }
          }
          $out | Set-Content -Encoding UTF8 inspect/client-version.txt
          $out | ForEach-Object { Write-Host $_ }

      - name: Upload inspection inventory
        uses: actions/upload-artifact@v4
        with:
          name: dbo-rox-client-version-inspection
          path: inspect/client-version.txt
          retention-days: 7
