name: Release Gridium 2 Alpha 1.3.17 Reload Loop Hotfix

on:
  push:
    branches:
      - fix/alpha1317-secondary-account-reload-loop
    paths:
      - '.github/workflows/release-alpha1317-reload-loop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply Alpha 1.3.17 hotfix
        run: node .github/scripts/apply-alpha1317-reload-loop-fix.mjs

      - name: Install dependencies
        working-directory: gridium2
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: gridium2
        run: npm run typecheck

      - name: Targeted server-monitor regressions
        working-directory: gridium2
        run: npx vitest run tests/account-server-monitor.test.ts tests/account-server-monitor-reload-loop.test.ts

      - name: Full unit tests
        working-directory: gridium2
        run: npm test

      - name: Long-running soak with GC
        working-directory: gridium2
        run: npm run test:soak

      - name: Electron lifecycle regression
        working-directory: gridium2
        run: npm run test:electron

      - name: Commit fixed release source
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gridium2/src/main/account-runtime.ts gridium2/package.json gridium2/package-lock.json gridium2/electron-builder.yml gridium2/src/renderer/src/App.tsx gridium2/src/renderer/index.html gridium2/src/main/index.ts
          git diff --cached --check
          git commit -m "release: Gridium 2 Alpha 1.3.17 secondary-account reload-loop hotfix"
          $sha = git rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          git push origin HEAD:fix/alpha1317-secondary-account-reload-loop

      - name: Build Electron app
        working-directory: gridium2
        run: npm run build

      - name: Build Windows installer
        working-directory: gridium2
        run: npx electron-builder --win nsis --x64

      - name: Verify installer and create update manifest
        id: meta
        shell: pwsh
        working-directory: gridium2
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $installerName = "Gridium-2-Alpha-1.3.17-Setup.exe"
          $installer = Join-Path "release" $installerName
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{ version = $pkg.version; installer = $installerName; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "release/gridium2-update.json" -Value $manifest -Encoding utf8NoBOM -NoNewline
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "installer=$installerName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: Gridium-2-Alpha-1.3.17-Reload-Loop-Hotfix-Windows
          path: |
            gridium2/release/Gridium-2-Alpha-1.3.17-Setup.exe
            gridium2/release/gridium2-update.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish Gridium 2 Alpha 1.3.17
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gridium2-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          name: Gridium 2 Alpha 1.3.17 · Secondary Account Reload Loop Hotfix
          body: |
            Gridium 2 Alpha 1.3.17 corrige o loop de recarregamento observado principalmente nas contas 2, 3 e 4 da Alpha 1.3.16.

            - cancela o watchdog da página anterior assim que uma nova navegação/load começa
            - preserva os request IDs dos WebSockets durante loads normais do PokeIdle
            - evita perder um socket ainda vivo quando Chromium não repete Network.webSocketCreated
            - mantém a recuperação limitada da Alpha 1.3.16 para um socket realmente perdido
            - continua limpando o rastreamento quando o renderer realmente cai
            - preserva Hunt Control, shiny, supply headless, mobile sync e otimizações anteriores
            - typecheck, regressões específicas, suíte unitária, soak com GC e regressão Electron executados antes da publicação
          prerelease: false
          files: |
            gridium2/release/Gridium-2-Alpha-1.3.17-Setup.exe
            gridium2/release/gridium2-update.json
