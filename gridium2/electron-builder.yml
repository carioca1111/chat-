appId: io.gridium.desktop.v2
productName: Gridium 2
artifactName: Gridium-2-Alpha-0.8.2-Setup.${ext}
asar: true
compression: maximum
directories:
  output: release
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
